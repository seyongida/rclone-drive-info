# 윈도용 열람 도구 만들기 — 공개 레포 seyongida/rclone-drive-info 의 .github/workflows/build-viewer.yml 에 같은 내용으로 둔다
# (2026-11-19 사용자 요청: 공개 레포의 무료 윈도 실행기로 빌드). 이 파일이 원본 — 바꾸면 공개 레포에도 같게 올린다.
#
# 지키는 것(측정 장비 코드는 아직 공개하지 않는다 — 특허 재검토 중):
# - 접근 파일(rigdrive.enc — 비밀번호로 잠김)은 비밀 값 VIEWER_ENC_B64 로만 받아 실행 파일 안에 넣고 지운다(2026-11-19 사용자: 실행 파일 하나 · 비밀번호만).
# - 코드는 공개 레포에 커밋하지 않는다. 실행기가 비공개 레포를 토큰(VIEWER_BUILD_TOKEN — 비공개 레포 Contents 읽기 · 쓰기만)으로 받는다.
# - 만든 파일은 공개 레포 artifact 로 남기지 않고 비공개 레포 릴리즈에 바로 올린다(공개 레포의 artifact · 로그는 누구나 본다).
# - 빌드 출력(모듈 이름 · 경로)은 로그에 찍지 않는다 — 실패할 때만 끝부분.
# - workflow_dispatch 만(쓰기 권한이 있는 사람만 돌린다). 포크의 PR 에는 비밀 값이 가지 않는다.
name: build-viewer-windows
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "비공개 레포 릴리즈 태그 (예: viewer-v2026.11.19.1) — 그 태그의 코드로 만들어 그 릴리즈에 올린다. test 면 브랜치 이름도 된다"
        required: true
      mode:
        description: "build = 만들어 올리기 · test = 윈도에서 열람 도구 시험만(올리지 않는다, 로그는 시험 이름 · 오류 한 줄만)"
        required: false
        default: build
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      RCLONE_VER: v1.76.0
    steps:
      - name: 비공개 레포 받기
        uses: actions/checkout@v4
        with:
          repository: seyongida/Auto_Call_Test
          ref: ${{ inputs.tag }}
          token: ${{ secrets.VIEWER_BUILD_TOKEN }}
          path: src
          sparse-checkout: |
            tools/viewer
            tools/vonr_check
            orchestrator/src
            orchestrator/pyproject.toml
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: 시험 (윈도)
        if: ${{ inputs.mode == 'test' }}
        shell: pwsh
        run: |
          python -m pip install -q -r src\tools\viewer\requirements.txt pytest 2>&1 | Out-Null
          $env:PYTHONPATH = "src\tools\viewer;src\orchestrator\src"
          python -m pytest -q -p no:cacheprovider --tb=line -rfE src\tools\viewer\tests 2>&1 | Select-String -Pattern "passed|failed|error|FAILED|ERROR|Error:|Exception" | ForEach-Object { $_.Line }
          exit $LASTEXITCODE
      - name: rclone 공식 배포본
        if: ${{ inputs.mode != 'test' }}
        shell: pwsh
        run: |
          $z = "rclone.zip"
          Invoke-WebRequest "https://downloads.rclone.org/$env:RCLONE_VER/rclone-$env:RCLONE_VER-windows-amd64.zip" -OutFile $z
          Expand-Archive $z -DestinationPath rc
          $exe = (Get-ChildItem rc -Recurse -Filter rclone.exe | Select-Object -First 1).FullName
          "RCLONE_EXE=$exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: 만들기 (실행 파일 하나 · 창 없음)
        if: ${{ inputs.mode != 'test' }}
        shell: pwsh
        env:
          ENC_B64: ${{ secrets.VIEWER_ENC_B64 }}
          GATE_JSON: ${{ secrets.VIEWER_GATE_JSON }}
        run: |
          $log = Join-Path $env:RUNNER_TEMP "build.log"
          $enc = Join-Path $env:RUNNER_TEMP "rigdrive.enc"
          $gate = Join-Path $env:RUNNER_TEMP "gate.json"
          if ($env:GATE_JSON) { [IO.File]::WriteAllText($gate, $env:GATE_JSON); $env:RIG_VIEWER_GATE = $gate }      # 문지기(권장) — 열쇠 파일 없이
          elseif ($env:ENC_B64) { [IO.File]::WriteAllBytes($enc, [Convert]::FromBase64String($env:ENC_B64)); $env:RIG_VIEWER_ENC = $enc }
          & pwsh -NoProfile -ExecutionPolicy Bypass -File src\tools\viewer\packaging\build_win.ps1 -Rclone $env:RCLONE_EXE *> $log
          $code = $LASTEXITCODE
          Remove-Item $enc, $gate -ErrorAction SilentlyContinue
          if ($code -ne 0 -or -not (Test-Path src\tools\viewer\dist\RigViewer.exe)) { Get-Content $log -Tail 40; exit 1 }
          Write-Host ("만들었습니다 — " + ($(if ($env:GATE_JSON) { "문지기 방식" } elseif ($env:ENC_B64) { "접근 파일 포함" } else { "접근 정보 없음" })))
      - name: 실행 확인 (잠금 화면)
        if: ${{ inputs.mode != 'test' }}
        shell: pwsh
        run: |
          $p = Start-Process src\tools\viewer\dist\RigViewer.exe -ArgumentList "run","--no-browser","--port","18765" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 90; $i++) { try { $r = Invoke-WebRequest http://127.0.0.1:18765/login -UseBasicParsing -TimeoutSec 2; if ($r.StatusCode -eq 200 -and $r.Content -match "측정 결과 열람" -and $r.Content -notmatch "접근 파일\(rigdrive.enc\)이 없습니다") { $ok = $true; break } } catch {} ; Start-Sleep 1 }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          Get-Process RigViewer -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          if (-not $ok) { Write-Host "열람 도구가 화면을 열지 못했거나 접근 파일을 찾지 못했습니다"; exit 1 }
          Write-Host "잠금 화면 응답 확인(접근 파일 찾음)"
      - name: 비공개 레포 릴리즈에 올리기
        if: ${{ inputs.mode != 'test' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.VIEWER_BUILD_TOKEN }}
        run: |
          Copy-Item src\tools\viewer\dist\RigViewer.exe RigViewer-windows-x64.exe
          gh release upload "${{ inputs.tag }}" RigViewer-windows-x64.exe --clobber -R seyongida/Auto_Call_Test
          Write-Host "올렸습니다: ${{ inputs.tag }} / RigViewer-windows-x64.exe"
