# 윈도용 열람 도구 만들기 — 공개 레포 seyongida/rclone-drive-info 의 .github/workflows/build-viewer.yml 에 같은 내용으로 둔다
# (2026-11-19 사용자 요청: 공개 레포의 무료 윈도 실행기로 빌드). 이 파일이 원본 — 바꾸면 공개 레포에도 같게 올린다.
#
# 지키는 것(측정 장비 코드는 아직 공개하지 않는다 — 특허 재검토 중):
# - 코드는 공개 레포에 커밋하지 않는다. 실행기가 비공개 레포를 토큰(VIEWER_BUILD_TOKEN — 비공개 레포 Contents 읽기 · 쓰기만)으로 받는다.
# - 만든 파일은 공개 레포 artifact 로 남기지 않고 비공개 레포 릴리즈에 바로 올린다(공개 레포의 artifact · 로그는 누구나 본다).
# - 빌드 출력(모듈 이름 · 경로)은 로그에 찍지 않는다 — 실패할 때만 끝부분.
# - workflow_dispatch 만(쓰기 권한이 있는 사람만 돌린다). 포크의 PR 에는 비밀 값이 가지 않는다.
name: build-viewer-windows
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "비공개 레포 릴리즈 태그 (예: viewer-v2026.11.19.1) — 그 태그의 코드로 만들어 그 릴리즈에 올린다"
        required: true
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      RCLONE_VER: v1.76.0
    steps:
      - name: 비공개 레포 받기
        uses: actions/checkout@v4
        with:
          repository: seyongida/Auto_Call_Test
          ref: ${{ inputs.tag }}
          token: ${{ secrets.VIEWER_BUILD_TOKEN }}
          path: src
          sparse-checkout: |
            tools/viewer
            tools/vonr_check
            orchestrator/src
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: rclone 공식 배포본
        shell: pwsh
        run: |
          $z = "rclone.zip"
          Invoke-WebRequest "https://downloads.rclone.org/$env:RCLONE_VER/rclone-$env:RCLONE_VER-windows-amd64.zip" -OutFile $z
          Expand-Archive $z -DestinationPath rc
          $exe = (Get-ChildItem rc -Recurse -Filter rclone.exe | Select-Object -First 1).FullName
          "RCLONE_EXE=$exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: 만들기
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP "build.log"
          & powershell -ExecutionPolicy Bypass -File src\tools\viewer\packaging\build_win.ps1 -Rclone $env:RCLONE_EXE *> $log
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path src\tools\viewer\dist\RigViewer\RigViewer.exe)) { Get-Content $log -Tail 40; exit 1 }
          Write-Host "만들었습니다"
      - name: 실행 확인 (잠금 화면)
        shell: pwsh
        run: |
          $p = Start-Process src\tools\viewer\dist\RigViewer\RigViewer.exe -ArgumentList "run","--no-browser","--port","18765" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) { try { $r = Invoke-WebRequest http://127.0.0.1:18765/login -UseBasicParsing -TimeoutSec 2; if ($r.StatusCode -eq 200 -and $r.Content -match "측정 결과 열람") { $ok = $true; break } } catch {} ; Start-Sleep 1 }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          if (-not $ok) { Write-Host "열람 도구가 화면을 열지 못했습니다"; exit 1 }
          Write-Host "잠금 화면 응답 확인"
      - name: 비공개 레포 릴리즈에 올리기
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.VIEWER_BUILD_TOKEN }}
        run: |
          Compress-Archive -Path src\tools\viewer\dist\RigViewer -DestinationPath RigViewer-windows-x64.zip
          gh release upload "${{ inputs.tag }}" RigViewer-windows-x64.zip --clobber -R seyongida/Auto_Call_Test
          Write-Host "올렸습니다: ${{ inputs.tag }} / RigViewer-windows-x64.zip"
